name: E2E

on:
  schedule:
    - cron: '0 19 * * *' # 02:00 Asia/Ho_Chi_Minh; GitHub runs schedules on the default branch only
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openboox
          POSTGRES_PASSWORD: openboox
          POSTGRES_DB: bookstore_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U openboox -d bookstore_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm --filter e2e exec playwright install --with-deps chromium
      # Port and database overrides live in e2e/env.ts; prepare.ts creates bookstore_e2e.
      - run: pnpm --filter e2e test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
